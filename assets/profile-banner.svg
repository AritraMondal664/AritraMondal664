      <rect x="115" y="2" width="20" height="15" rx="3" fill="#ffb86c" />
      <rect x="140" y="2" width="20" height="15" rx="3" fill="#f1fa8c" />
      <rect x="165" y="2" width="20" height="15" rx="3" fill="#50fa7b" />
      <rect x="190" y="2" width="20" height="15" rx="3" fill="#8be9fd" />
