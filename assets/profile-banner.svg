      <text x="0" y="27" class="mono" fill="#79c0ff" font-size="11" font-weight="600" xml:space="preserve"> ██╔══██╗██╔══██╗██║╚══██╔══╝██╔══██╗██╔══██╗</text>
      <text x="0" y="40" class="mono" fill="#58a6ff" font-size="11" font-weight="500" xml:space="preserve"> ███████║██████╔╝██║   ██║   ██████╔╝███████║</text>
      <text x="0" y="53" class="mono" fill="#58a6ff" font-size="11" font-weight="500" xml:space="preserve"> ██╔══██║██╔══██╗██║   ██║   ██╔══██╗██╔══██║</text>
      <text x="0" y="66" class="mono" fill="#4a7bb0" font-size="11" font-weight="500" xml:space="preserve"> ██║  ██║██║  ██║██║   ██║   ██║  ██║██║  ██║</text>
      <text x="0" y="79" class="mono" fill="#4a7bb0" font-size="11" font-weight="500" xml:space="preserve"> ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝   ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝</text>
