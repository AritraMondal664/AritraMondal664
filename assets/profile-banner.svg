      <text x="0" y="27" class="mono c-cyan" font-size="10.5" font-weight="bold" xml:space="preserve"> ██╔══██╗██╔══██╗██║╚══██╔══╝██╔══██╗██╔══██╗</text>
      <text x="0" y="40" class="mono c-blue" font-size="10.5" xml:space="preserve"> ███████║██████╔╝██║   ██║   ██████╔╝███████║</text>
      <text x="0" y="53" class="mono c-blue" font-size="10.5" xml:space="preserve"> ██╔══██║██╔══██╗██║   ██║   ██╔══██╗██╔══██║</text>
      <text x="0" y="66" class="mono c-blue" font-size="10.5" xml:space="preserve"> ██║  ██║██║  ██║██║   ██║   ██║  ██║██║  ██║</text>
      <text x="0" y="79" class="mono c-blue" font-size="10.5" xml:space="preserve"> ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝   ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝</text>
      
      <text x="0" y="98" class="mono c-purple" font-size="11" font-weight="bold" xml:space="preserve"> [ SOFTWARE DEVELOPER // JAVA &amp; FULL-STACK ]</text>

