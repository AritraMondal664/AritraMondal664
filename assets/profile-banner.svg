<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="windowShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f0ff" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
    }
    .c-cyan { fill: #00f0ff; }
    .c-green { fill: #39d353; }
    .c-purple { fill: #a855f7; }
    .c-blue { fill: #58a6ff; }
    .c-orange { fill: #ffb86c; }
    .c-yellow { fill: #f1fa8c; }
    .c-white { fill: #f0f6fc; }
    .c-dim { fill: #484f58; }
    .c-sep { fill: #30363d; }
    .c-dots { fill: #3b424b; }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Window Container -->
  <rect x="8" y="8" width="924" height="414" rx="8" ry="8" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#windowShadow)" />
  <rect x="8" y="8" width="924" height="414" rx="8" ry="8" fill="none" stroke="#00f0ff" stroke-width="0.6" stroke-opacity="0.3" />

  <!-- Terminal Top Bar -->
  <path d="M 8 16 Q 8 8 16 8 L 924 8 Q 932 8 932 16 L 932 40 L 8 40 Z" fill="url(#barGrad)" />
  <line x1="8" y1="40" x2="932" y2="40" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Buttons -->
  <circle cx="26" cy="24" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="44" cy="24" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="62" cy="24" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="470" y="28" text-anchor="middle" class="mono" fill="#8b949e" font-size="12" font-weight="500">
    aritra@github: ~/AritraMondal664 (terminal)
  </text>

