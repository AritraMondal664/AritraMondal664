      <rect x="112" y="2" width="18" height="14" rx="2" fill="#ffa657" opacity="0.85" />
      <rect x="136" y="2" width="18" height="14" rx="2" fill="#e3b341" opacity="0.85" />
      <rect x="160" y="2" width="18" height="14" rx="2" fill="#56d364" opacity="0.85" />
      <rect x="184" y="2" width="18" height="14" rx="2" fill="#79c0ff" opacity="0.85" />
