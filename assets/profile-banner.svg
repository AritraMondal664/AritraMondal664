        <text x="0" y="26" class="mono c-purple" font-size="10" xml:space="preserve">|  <tspan class="c-cyan">&gt;</tspan> <tspan class="c-white">DEV CORE</tspan>       : <tspan class="c-green">JAVA &amp; SPRING BOOT</tspan>       | |</text>
        <text x="0" y="39" class="mono c-purple" font-size="10" xml:space="preserve">|  <tspan class="c-cyan">&gt;</tspan> <tspan class="c-white">WEB STACK</tspan>      : <tspan class="c-blue">REACT &amp; NEXT.JS</tspan>          | |</text>
        <text x="0" y="52" class="mono c-purple" font-size="10" xml:space="preserve">|  <tspan class="c-cyan">&gt;</tspan> <tspan class="c-white">SERVICES</tspan>       : <tspan class="c-orange">NODE.JS &amp; EXPRESS</tspan>        | |</text>
        <text x="0" y="65" class="mono c-purple" font-size="10" xml:space="preserve">|  <tspan class="c-cyan">&gt;</tspan> <tspan class="c-white">DATABASES</tspan>      : <tspan class="c-yellow">MYSQL / ORACLE / MONGO</tspan>   | |</text>
        <text x="0" y="78" class="mono c-purple" font-size="10" xml:space="preserve">|  <tspan class="c-cyan">&gt;</tspan> <tspan class="c-white">DEV-OPS</tspan>        : <tspan class="c-white">GIT / DOCKER / AWS</tspan>      | |</text>
        <text x="0" y="91" class="mono c-dim" font-size="10" xml:space="preserve">|                                         | /</text>
        <text x="0" y="104" class="mono c-dim" font-size="10" xml:space="preserve"> '─────────────────────────────────────────'</text>
        <text x="0" y="117" class="mono c-green" font-size="10" xml:space="preserve">    \=======\                     /=======/</text>
        <text x="0" y="127" class="mono c-green" font-size="10" xml:space="preserve">     `──────'                     `──────'</text>
