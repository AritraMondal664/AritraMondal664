      <text x="0" y="27" class="mono" fill="#38bdf8" font-size="11" font-weight="bold" xml:space="preserve"> ██╔══██╗██╔══██╗██║╚══██╔══╝██╔══██╗██╔══██╗</text>
      <text x="0" y="40" class="mono" fill="#58a6ff" font-size="11" xml:space="preserve"> ███████║██████╔╝██║   ██║   ██████╔╝███████║</text>
      <text x="0" y="53" class="mono" fill="#79c0ff" font-size="11" xml:space="preserve"> ██╔══██║██╔══██╗██║   ██║   ██╔══██╗██╔══██║</text>
      <text x="0" y="66" class="mono" fill="#a855f7" font-size="11" xml:space="preserve"> ██║  ██║██║  ██║██║   ██║   ██║  ██║██║  ██║</text>
      <text x="0" y="79" class="mono" fill="#c084fc" font-size="11" xml:space="preserve"> ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝   ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝</text>
    </g>

