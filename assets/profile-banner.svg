    <g transform="translate(0, 252)">
      <text x="0" y="14" class="mono" fill="#8b949e" font-size="11.5" font-weight="600">Colors ........ </text>
      <rect x="95" y="2" width="18" height="15" rx="2.5" fill="#ff5555" />
      <rect x="118" y="2" width="18" height="15" rx="2.5" fill="#ffb86c" />
      <rect x="141" y="2" width="18" height="15" rx="2.5" fill="#f1fa8c" />
      <rect x="164" y="2" width="18" height="15" rx="2.5" fill="#50fa7b" />
      <rect x="187" y="2" width="18" height="15" rx="2.5" fill="#8be9fd" />
      <rect x="210" y="2" width="18" height="15" rx="2.5" fill="#bd93f9" />
      <rect x="233" y="2" width="18" height="15" rx="2.5" fill="#ff79c6" />
      <rect x="256" y="2" width="18" height="15" rx="2.5" fill="#f8f8f2" />

