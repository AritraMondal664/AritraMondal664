<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
    
    <linearGradient id="titleBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090d13" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#00f0ff" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, Monaco, 'Courier New', monospace;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Outer Window Frame -->
  <rect x="8" y="8" width="944" height="424" rx="10" ry="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#subtleShadow)" />
  <rect x="8" y="8" width="944" height="424" rx="10" ry="10" fill="none" stroke="url(#cyanPurple)" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Terminal Title Bar -->
  <path d="M 8 18 Q 8 8 18 8 L 942 8 Q 952 8 952 18 L 952 42 L 8 42 Z" fill="url(#titleBarGrad)" />
  <line x1="8" y1="42" x2="952" y2="42" stroke="#30363d" stroke-width="1" />

  <!-- macOS Window Control Dots -->
  <circle cx="28" cy="25" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="46" cy="25" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="64" cy="25" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Header Title -->
  <text x="480" y="29" text-anchor="middle" class="mono" fill="#8b949e" font-size="12" font-weight="500">
    aritra@workstation: ~/AritraMondal664 (zsh)
  </text>

  <!-- Pulse Status Badge on Top Right -->
