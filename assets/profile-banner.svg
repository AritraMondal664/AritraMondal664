    <text x="0" y="0" class="mono" font-size="13">
      <tspan class="c-cyan" font-weight="bold">aritra</tspan><tspan fill="#8b949e">@</tspan><tspan class="c-green" font-weight="bold">github</tspan><tspan class="c-purple">:~$</tspan><tspan class="c-white"> fastfetch --dev</tspan>
    </text>

